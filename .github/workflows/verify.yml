name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quack_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: quack_ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quack_test -d quack_ledger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      QUACK_ENV: production
      QUACK_AUTH_MODE: "off"
      MODEL_API_KEY: ""
      QUACK_LEDGER_TEST_DATABASE_URL: postgresql://quack_test:test-only-password@127.0.0.1:5432/quack_ledger_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.lock
            services/api/requirements-tooling.lock
            services/api/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/python -m pip install -r services/api/requirements.lock -r services/api/requirements-tooling.lock -r services/api/requirements-dev.txt
      - name: Install web
        working-directory: apps/web
        run: npm ci
      - name: Audit locked Python dependencies
        run: services/api/.venv/bin/python -m pip_audit --no-deps --disable-pip -r services/api/requirements.lock -r services/api/requirements-tooling.lock
      - name: Audit web dependencies
        working-directory: apps/web
        run: npm audit
      - name: Install test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Install checksum-verified secret scanner
        run: |
          mkdir -p "$RUNNER_TEMP/quack-tools"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/quack-tools/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/quack-tools/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/quack-tools/gitleaks.tar.gz" -C "$RUNNER_TEMP/quack-tools" gitleaks
          echo "$RUNNER_TEMP/quack-tools" >> "$GITHUB_PATH"
      - name: Run release checks
        run: npm run verify:release
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
